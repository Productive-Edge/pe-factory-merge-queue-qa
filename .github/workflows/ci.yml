name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # QA run 12: hold this merge group long enough for the next change to queue behind it.
      - if: github.event_name == 'merge_group'
        run: sleep 300
      - run: npm test
  # The changelog is checked in the merge queue only; on a pull request this job passes at once.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - if: github.event_name == 'merge_group'
        run: sh scripts/check-changelog.sh "${{ github.event.merge_group.base_sha }}" "${{ github.event.merge_group.head_sha }}"
      - if: github.event_name != 'merge_group'
        run: echo "checked in the merge queue"
